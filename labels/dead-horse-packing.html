<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dead Horse — Packing 100×35 mm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0e0c0a;
      --bg1: #1a1410;
      --ink: #f2ede6;
      --muted: #8a847a;
      --accent: #c45c26;
      --warn-bg: #2a1810;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 24px;
      background:
        radial-gradient(ellipse at 80% 100%, #2a2118 0%, transparent 45%),
        #12100e;
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      padding: 32px 16px;
    }
    .meta {
      width: 100mm;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .label {
      width: 100mm;
      height: 35mm;
      background: linear-gradient(95deg, var(--bg1) 0%, var(--bg0) 70%);
      color: var(--ink);
      display: grid;
      grid-template-columns: 30mm 1fr;
      overflow: hidden;
      position: relative;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }
    .label::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .left {
      padding: 2.2mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 0.5mm solid var(--accent);
      position: relative;
      z-index: 1;
      background: linear-gradient(180deg, rgba(196,92,38,0.12), transparent 60%);
    }
    .brand {
      font-family: Oswald, sans-serif;
      font-weight: 700;
      font-size: 11pt;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 0.95;
    }
    .left-meta {
      display: flex;
      flex-direction: column;
      gap: 0.8mm;
    }
    .weight {
      font-size: 7pt;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .age {
      font-size: 7.5pt;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
    }
    .right {
      display: grid;
      grid-template-rows: 1fr 7mm;
      position: relative;
      z-index: 1;
    }
    .tips {
      padding: 2.2mm 2.4mm 1.5mm;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.4mm;
    }
    .tips h2 {
      font-family: Oswald, sans-serif;
      font-size: 6pt;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .tips p {
      font-size: 5.6pt;
      line-height: 1.28;
      font-weight: 500;
    }
    .bottom {
      background: var(--warn-bg);
      display: flex;
      align-items: center;
      padding: 0 2.4mm;
      border-top: 0.3mm solid rgba(196, 92, 38, 0.7);
    }
    .bottom p {
      font-size: 4.5pt;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    @media print {
      body { background: none; padding: 0; display: block; }
      .meta { display: none; }
      .label { box-shadow: none; }
      @page { size: 100mm 35mm; margin: 0; }
    }
  </style>
</head>
<body>
  <p class="meta">Варіант B · Packing tips · 100×35 мм · Dead Horse</p>
  <article class="label" aria-label="Стікер забивки Dead Horse 100 на 35 мм">
    <aside class="left">
      <div class="brand">DEAD<br />HORSE</div>
      <div class="left-meta">
        <span class="weight">200 g</span>
        <span class="age">18+</span>
      </div>
    </aside>
    <div class="right">
      <div class="tips">
        <h2>Рекомендації щодо забивки</h2>
        <p>Класичні чаші — прямий потік повітря.</p>
        <p>Вугілля: 2–3 шт. залежно від розміру та типу чаші.</p>
      </div>
      <footer class="bottom">
        <p>Містить отрути, канцерогени, мутагени · Термін: 24 міс.</p>
      </footer>
    </div>
  </article>
</body>
</html>
